<form class="seed-form" (ngSubmit)="onSubmit()">
    <h3>Імпорт / Seed даних</h3>

    <div class="form-row">
        <div class="form-group">
            <label>Видимість:</label>
            <select [ngModel]="selectedVisibility()" (ngModelChange)="selectedVisibility.set($event)" name="visibility">
                @for (opt of visibilityOptions; track opt.value) {
                <option [ngValue]="opt.value">{{ opt.label }}</option>
                }
            </select>
        </div>

        <div class="form-group">
            <label>Статус:</label>
            <select [ngModel]="selectedStatus()" (ngModelChange)="selectedStatus.set($event)" name="status">
                @for (opt of statusOptions; track opt.value) {
                <option [ngValue]="opt.value">{{ opt.label }}</option>
                }
            </select>
        </div>
    </div>


    <div class="form-row">
        <!-- Тип медіа -->
        <div class="form-group">
            <label>Тип медіа:</label>
            <select [ngModel]="selectedType()" (ngModelChange)="selectedType.set($event)" name="type">
                @for (opt of typeOptions; track opt.value) {
                <option [ngValue]="opt.value">{{ opt.label }}</option>
                }
            </select>
        </div>
        <div class="form-group">
            <label>Автор (опціонально):</label>
            <input type="text" [ngModel]="authorInput()" (ngModelChange)="authorInput.set($event)" name="author"
                placeholder="Введіть автора...">
        </div>
    </div>

    <!-- Поля для Тегів та Автора -->
    <div class="form-row">
        <div class="form-group">
            <label>Теги (через кому):</label>
            <input type="text" [ngModel]="tagsInput()" (ngModelChange)="tagsInput.set($event)" name="tags"
                placeholder="action, sci-fi, top">
        </div>
    </div>

    <div class="form-group">
        <label>Дані (Payload):</label>
        <textarea [ngModel]="payloadText()" (ngModelChange)="payloadText.set($event)" name="payload" rows="8"
            placeholder="https://example1.com    name1    6&#10;https://example2.com    name2    7" required>
        </textarea>
        <small class="hint">Вставте рядки у форматі: URL [TAB] Назва [TAB] Оцінка</small>
    </div>

    <div class="form-actions">
        <!-- Червона кнопка очищення бази даних -->
        <button type="button" class="btn-clear-db" [disabled]="loading()" (click)="onClearDatabase()">
            Очистити БД 🗑️
        </button>

        <div class="right-actions">
            <button type="button" class="btn-cancel" (click)="cancelled.emit()">Скасувати</button>
            <button type="submit" class="btn-submit" [disabled]="loading()">
                @if (loading()) { Надсилання... } @else { Виконати Seed }
            </button>
        </div>
    </div>
</form>
