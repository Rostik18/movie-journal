<div class="create-actor-container">
    <div class="form-card">
        <h2>Додати нового актора</h2>

        <form (ngSubmit)="onSubmit()">
            <!-- Повне ім'я -->
            <div class="form-group">
                <label for="fullName">Повне ім'я *</label>
                <input type="text" id="fullName" [(ngModel)]="actorData.fullName" name="fullName" required
                    placeholder="Наприклад: Ryan Gosling">
            </div>

            <!-- Фото та прев'ю -->
            <div class="form-group">
                <label for="photoUrl">Посилання на фото (URL)</label>
                <input type="url" id="photoUrl" [ngModel]="actorData.photoUrl"
                    (ngModelChange)="onPhotoUrlChange($event)" name="photoUrl"
                    placeholder="https://example.com/photo.jpg">

                @if (actorData.photoUrl) {
                <div class="photo-preview-container">
                    <div class="preview-box">
                        @if (!imageError) {
                        <img [src]="actorData.photoUrl" alt="Прев'ю фото актора" class="large-preview-img"
                            (error)="imageError = true">
                        } @else {
                        <div class="preview-error"><span>⚠️ Не вдалося завантажити фото</span></div>
                        }
                    </div>
                    <span class="preview-hint">Попередній перегляд фото</span>
                </div>
                }
            </div>

            <!-- Дата народження -->
            <div class="form-group">
                <label for="birthYear">Дата народження (Рік / Місяць / День)</label>
                <div class="date-inputs-row">
                    <input type="number" id="birthYear" [(ngModel)]="birthYear" name="birthYear" placeholder="Рік"
                        min="1800" max="2100" aria-label="Рік народження">
                    <input type="number" [(ngModel)]="birthMonth" name="birthMonth" placeholder="Місяць" min="1"
                        max="12" aria-label="Місяць народження">
                    <input type="number" [(ngModel)]="birthDay" name="birthDay" placeholder="День" min="1" max="31"
                        aria-label="День народження">
                </div>
            </div>

            <!-- Видимість -->
            <div class="form-group">
                <label for="visibility">Видимість</label>
                <select id="visibility" [(ngModel)]="actorData.visibility" name="visibility">
                    @for (opt of visibilityOptions; track opt.value) {
                    <option [ngValue]="opt.value">{{ opt.label }}</option>
                    }
                </select>
            </div>

            <!-- Біографія -->
            <div class="form-group">
                <label for="biography">Біографія</label>
                <textarea id="biography" [(ngModel)]="actorData.biography" name="biography" rows="3"
                    placeholder="Коротка біографія актора..."></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" (click)="onCancel()">Скасувати</button>
                <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
                    {{ isSubmitting() ? 'Збереження…' : 'Зберегти актора' }}
                </button>
            </div>
        </form>
    </div>
</div>
