@if (links().length > 0) {
<div class="links-section">
    <h4>Посилання</h4>
    <div class="sidebar-links-list">
        @for (link of links(); track link.url) {
        <div class="sidebar-link-row">
            <button type="button" class="btn-copy-link" (click)="copy(link.url)" title="Копіювати посилання">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
            <a [href]="link.url" target="_blank" rel="noopener noreferrer" class="link-url">{{ link.url }}</a>
            @if (link.type !== LinkType.Any) {
            <span class="link-type-badge" [title]="typeLabels[link.type]">{{ link.type === LinkType.Video ? '🎞️' : '▶'
                }}</span>
            }
        </div>
        }
    </div>
</div>
}
