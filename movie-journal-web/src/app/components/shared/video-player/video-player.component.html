<div class="player">
    @if (!canPlay()) {
    <div class="player-fallback">
        <p>Не вдалося відтворити тут.</p>
        <a class="btn-secondary" [href]="link().url" target="_blank" rel="noopener noreferrer">Відкрити на сайті ↗</a>
    </div>
    } @else if (!playing()) {
    <button type="button" class="player-cover" (click)="play()"
        [attr.aria-label]="'Відтворити' + (title() ? ': ' + title() : '')">
        @if (posterUrl()) {
        <img [src]="posterUrl()" alt="" class="cover-img">
        }
        <span class="play-icon" aria-hidden="true">▶</span>
    </button>
    } @else if (link().type === LinkType.Video) {
    <video class="player-media" controls autoplay playsinline preload="metadata" [src]="link().url"
        (error)="failed.set(true)"></video>
    } @else if (embedUrl(); as src) {
    <iframe class="player-media" [src]="src" [title]="title() || 'Відео'" loading="lazy" allowfullscreen
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="unsafe-url"></iframe>
    <a class="player-open" [href]="link().url" target="_blank" rel="noopener noreferrer">Не відтворюється? Відкрити на
        сайті ↗</a>
    }
</div>
