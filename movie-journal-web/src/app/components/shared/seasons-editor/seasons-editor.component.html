<div class="section-header">
    <h4>Сезони та епізоди</h4>
    <button type="button" class="btn-sm" (click)="addSeason()">+ Додати сезон</button>
</div>

@for (season of seasons(); track $index; let sIndex = $index) {
<div class="season-box">
    <div class="season-title-row">
        <span>Сезон {{ season.number }}</span>
        <button type="button" class="btn-del" (click)="removeSeason(sIndex)">Видалити сезон</button>
    </div>

    <div class="episodes-list">
        @for (ep of season.episodes; track $index; let eIndex = $index) {
        <div class="episode-row">
            <span>Серія {{ ep.number }}:</span>
            <input type="text" [ngModel]="ep.title" (ngModelChange)="setEpisodeTitle(sIndex, eIndex, $event)"
                [name]="'season_' + sIndex + '_ep_' + eIndex" placeholder="Назва серії">
            <button type="button" class="btn-danger-sm" (click)="removeEpisode(sIndex, eIndex)">&times;</button>
        </div>
        }
        <button type="button" class="btn-xs" (click)="addEpisode(sIndex)">+ Додати серію</button>
    </div>
</div>
}
