<div class="watching-form-card">
    <h3>{{ isEditMode() ? 'Редагувати запис у списку' : 'Додати до списку перегляду' }}</h3>

    <!-- 1. Пошук існуючого фільму (у редагуванні медіа не змінюється) -->
    @if (isEditMode()) {
    <div class="form-group">
        <label>Фільм / Серіал</label>
        <div class="selected-success">
            <span>🎬 <strong>{{ selectedMedia()?.title }}</strong></span>
        </div>
    </div>
    } @else if (!isCreatingNewMedia()) {
    <app-media-picker class="form-group" [(query)]="mediaSearchQuery" [(selected)]="selectedMedia"
        (createNew)="startCreateNew($event)" />
    } @else {
    <!-- 2. Вбудована форма створення нового медіа -->
    <div class="inline-creation-section">
        <div class="inline-title-row">
            <span>Створення нового фільму для списку</span>
            <button type="button" class="btn-cancel-inline" (click)="cancelCreateNew()">Скасувати</button>
        </div>

        <app-media-form [embedded]="true" [initialUrl]="newMediaUrl()" [initialTitle]="newMediaTitle()"
            (mediaCreatedWithData)="onNewMediaCreated($event)" />
    </div>
    }

    <!-- 3. Поля user-watching: статус, рейтинг, прогрес, нотатки -->
    <div class="form-row">
        <div class="form-group">
            <label for="status">Статус перегляду</label>
            <select id="status" [(ngModel)]="formData.status">
                @for (opt of statusOptions; track opt.value) {
                <option [ngValue]="opt.value">{{ opt.label }}</option>
                }
            </select>
        </div>
        <div class="form-group">
            <label>Рейтинг</label>
            <app-rating-stars [initialRating]="formData.rating ?? null" (ratingChange)="formData.rating = $event" />
        </div>
    </div>

    <!-- Поле для введення зупинки у хвилинах (тільки для статусу Watching) -->
    @if (formData.status === WatchStatus.Watching) {
    <div class="form-group">
        <label for="stoppedAtMinutes">Зупинено на (хвилини)</label>
        <input id="stoppedAtMinutes" type="number" min="0" [ngModel]="stoppedAtMinutes"
            (ngModelChange)="stoppedAtMinutes = $event" placeholder="Наприклад: 45">
    </div>
    }

    @if (showProgressFields) {
    <div class="form-row">
        <div class="form-group">
            <label for="currentSeason">Поточний сезон</label>
            <input id="currentSeason" type="number" min="1" [(ngModel)]="formData.currentSeasonNumber" placeholder="1">
        </div>
        <div class="form-group">
            <label for="currentEpisode">Поточний епізод</label>
            <input id="currentEpisode" type="number" min="1" [(ngModel)]="formData.currentEpisodeNumber"
                placeholder="5">
        </div>
    </div>
    }

    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" [(ngModel)]="formData.notes" placeholder="Ваші враження..."></textarea>
    </div>

    <!-- Єдина кнопка збереження для всієї форми -->
    <div class="form-actions">
        <button type="button" class="btn-submit" [disabled]="isBusy() || (isEditMode() && !hasChanges())"
            (click)="onSubmit()">
            {{ isBusy() ? 'Збереження…' : (isEditMode() ? 'Зберегти зміни' : 'Зберегти у список') }}
        </button>
    </div>
</div>
