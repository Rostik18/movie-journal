<div class="card" tabindex="0" (click)="onClick($event)" (keydown.enter)="onKeydown($event)"
    (keydown.space)="onKeydown($event)">

    <div class="image-wrapper">
        @if (hasImage()) {
        <img [src]="imageUrl()" [alt]="imageAlt()" class="image" (error)="imageFailed.set(true)">
        } @else {
        <div class="no-image">{{ noImageText() }}</div>
        }

        <!--
            Зліва зверху: слот [poster-top-left] та бейдж (input badge).
            Без вмісту в слоті бейдж стоїть у куті, як раніше.
        -->
        <div class="overlay overlay-top-left">
            <ng-content select="[poster-top-left]" />
            @if (badge()) {
            <span class="badge" [class]="badgeClass()">{{ badge() }}</span>
            }
        </div>

        <!--
            Справа зверху: іконка видимості та слот [poster-top-right].
            Без вмісту в слоті іконка видимості стоїть у куті, як раніше.
        -->
        <div class="overlay overlay-top-right">
            @if (hasVisibility()) {
            <div class="visibility-icon" [title]="isPublic() ? 'Публічний' : 'Приватний'">
                @if (isPublic()) {
                <!-- Іконка глобуса -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path
                        d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                    </path>
                </svg>
                } @else {
                <!-- Іконка замка -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                }
            </div>
            }
            <ng-content select="[poster-top-right]" />
        </div>

        <!-- Справа знизу: слот [poster-bottom-right] (наприклад, тривалість) -->
        <div class="overlay overlay-bottom-right">
            <ng-content select="[poster-bottom-right]" />
        </div>
    </div>

    <div class="card-body">
        <h3>{{ title() }}</h3>
        <!-- Усе унікальне для конкретної сутності -->
        <ng-content />
    </div>
</div>
