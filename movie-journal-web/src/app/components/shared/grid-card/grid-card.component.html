<div class="card" (click)="cardClick.emit()">

    <div class="image-wrapper">
        <img *ngIf="imageUrl(); else noImage" [src]="imageUrl()" [alt]="imageAlt()" class="image">
        <ng-template #noImage>
            <div class="no-image">{{ noImageText() }}</div>
        </ng-template>

        <!-- Бейдж зліва зверху -->
        <span *ngIf="badge()" class="badge" [ngClass]="badgeClass()">{{ badge() }}</span>

        <!-- Іконка видимості справа зверху (Глобус або Замок) -->
        @if (visibility()) {
        <div class="visibility-icon" [title]="visibility() === 'Public' ? 'Публічний' : 'Приватний'">
            @if (visibility() === 'Public') {
            <!-- Іконка глобуса -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                </path>
            </svg>
            } @else {
            <!-- Іконка замка -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            }
        </div>
        }
    </div>

    <div class="card-body">
        <h3>{{ title() }}</h3>
        <!-- Усе унікальне для конкретної сутності -->
        <ng-content></ng-content>
    </div>
</div>
