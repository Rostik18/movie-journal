<div class="app-layout">
    <!-- 1. Верхня смуга -->
    <header class="app-header">
        <div class="header-left">
            <h2>🎬 Кіножурнал</h2>
            <span class="server-status" [class]="serverStatus()" role="status">
                <span class="status-dot" aria-hidden="true">●</span>
                Сервер {{ statusLabel() }}
            </span>
        </div>
        <div class="header-right">
            <span class="username">Вітаю, {{ userName }}!</span>
            <button type="button" class="logout-btn" (click)="logout()">Вихід</button>
        </div>
    </header>

    <div class="app-body">
        <!-- 2. Бічне меню -->
        <aside class="app-sidebar">
            <nav aria-label="Головна навігація">
                @for (item of navItems; track item.path) {
                @if (item.render) {
                <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
                    {{ item.label }}
                </a>
                }
                }
            </nav>
        </aside>

        <!-- 3. Основний простір для сторінок -->
        <main class="app-content">
            <router-outlet />
        </main>
    </div>

    <app-toast />
</div>
