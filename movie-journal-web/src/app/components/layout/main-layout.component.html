<div class="app-layout">
    <!-- 1. Верхня смуга -->
    <header class="app-header">
        <div class="header-left">
            <h2>🎬 Кіножурнал</h2>
            <span class="server-status" [class]="serverStatus()" role="status">
                <span class="status-dot" aria-hidden="true">●</span>
                Сервер {{ statusLabel() }}
            </span>
        </div>
        <div class="header-right">
            <!-- Дропдаун користувача -->
            <div class="user-menu-container">
                <button type="button" class="user-menu-toggle" (click)="toggleUserDropdown($event)"
                    [attr.aria-expanded]="isUserDropdownOpen()">
                    <span class="username">Вітаю, {{ userName() }}! ▾</span>
                </button>

                @if (isUserDropdownOpen()) {
                <div class="user-dropdown">
                    <button type="button" class="dropdown-item" (click)="goToProfile()">Профіль</button>
                    <div class="dropdown-divider"></div>
                    <button type="button" class="dropdown-item danger" (click)="logout()">Вихід</button>
                </div>
                }
            </div>
        </div>
    </header>

    <div class="app-body">
        <!-- 2. Бічне меню -->
        <aside class="app-sidebar" [class.collapsed]="isSidebarCollapsed()">
            <nav id="main-nav" aria-label="Головна навігація">
                @for (item of navItems; track item.path) {
                @if (item.render) {
                <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
                    [attr.aria-label]="isSidebarCollapsed() ? item.label : null"
                    [title]="isSidebarCollapsed() ? item.label : ''">
                    <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
                    <span class="nav-text">{{ item.label }}</span>
                </a>
                }
                }
            </nav>

            <button type="button" class="sidebar-toggle" (click)="toggleSidebar()"
                [attr.aria-expanded]="!isSidebarCollapsed()" aria-controls="main-nav"
                [attr.aria-label]="isSidebarCollapsed() ? 'Розгорнути меню' : 'Згорнути меню'"
                [title]="isSidebarCollapsed() ? 'Розгорнути меню' : 'Згорнути меню'">
                <span class="nav-icon" aria-hidden="true">{{ isSidebarCollapsed() ? '»' : '«' }}</span>
                <span class="nav-text">Згорнути</span>
            </button>
        </aside>

        <!-- 3. Основний простір для сторінок -->
        <main class="app-content">
            <router-outlet />
        </main>
    </div>

    <app-toast />
</div>
