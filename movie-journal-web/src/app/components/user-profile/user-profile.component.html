<div class="profile-container">
    <h2>Мій профіль</h2>

    @if (loading()) {
    <div class="loading">Завантаження профілю...</div>
    } @else {
    <div class="profile-grid">
        <!-- Блок зміни основних даних -->
        <div class="profile-card">
            <h3>Особисті дані</h3>
            <form [formGroup]="profileForm" (ngSubmit)="onUpdateProfile()">
                <div class="form-group">
                    <label for="login">Логін</label>
                    <input id="login" type="text" formControlName="login" class="form-control">
                </div>

                <div class="form-group">
                    <label for="displayName">Відображуване ім'я</label>
                    <input id="displayName" type="text" formControlName="displayName" class="form-control"
                        placeholder="Введіть ваше ім'я">
                </div>

                <button type="submit" class="btn-primary" [disabled]="profileForm.invalid">Зберегти зміни</button>
            </form>
        </div>

        <!-- Блок зміни пароля -->
        <div class="profile-card">
            <h3>Зміна пароля</h3>
            <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()">
                <div class="form-group">
                    <label for="newPassword">Новий пароль</label>
                    <input id="newPassword" type="password" formControlName="newPassword" class="form-control"
                        placeholder="Мінімум 6 символів">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Підтвердження пароля</label>
                    <input id="confirmPassword" type="password" formControlName="confirmPassword" class="form-control"
                        placeholder="Повторіть новий пароль">
                </div>

                <button type="submit" class="btn-secondary" [disabled]="passwordForm.invalid">Змінити пароль</button>
            </form>
        </div>
    </div>
    }
</div>
