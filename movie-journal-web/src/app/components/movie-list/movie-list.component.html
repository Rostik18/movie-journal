<div class="movies-container">
    <div class="header-section">
        <div class="title-area">
            <h2>Каталог фільмів</h2>
            <span class="count-badge">Знайдено: {{ totalCount() }}</span>

            <app-add-button label="Додати фільм" (clicked)="openModal()"> </app-add-button>
        </div>

        <app-view-switcher [currentMode]="viewMode()" (modeChange)="viewMode.set($event)">
        </app-view-switcher>
    </div>

    <div *ngIf="loading()" class="loading">Завантаження фільмів...</div>

    <!-- РЕЖИМ 1: Плитки (Grid) -->
    <div class="cards-grid" *ngIf="!loading() && viewMode() === 'grid'">
        <app-grid-card *ngFor="let mov of movies()" [imageUrl]="mov.posterUrl" [imageAlt]="mov.title"
            [title]="mov.title" [showDelete]="userService.isAdmin()" [deleteAction]="getDeleteCallback(mov)"
            (deleted)="onDeleted(mov)">

            <p class="original-title">{{ mov.originalTitle }} ({{ mov.releaseYear }})</p>
            <div class="genres">
                <span *ngFor="let genre of mov.genres" class="genre-tag">{{ genre }}</span>
            </div>
            <div class="status-buttons">
                <button *ngFor="let opt of watchStatusOptions" [class]="'status-btn ' + opt.class"
                    (click)="setWatchStatus(mov, opt.status)">{{ opt.label }}</button>
            </div>
        </app-grid-card>
    </div>

    <!-- РЕЖИМ 2: Таблиця / Список (List) -->
    <div class="movies-list-view" *ngIf="!loading() && viewMode() === 'list'">
        <table class="movies-table">
            <thead>
                <tr>
                    <th>Постер</th>
                    <th>Назва</th>
                    <th>Оригінал / Рік</th>
                    <th>Тип</th>
                    <th>Жанри</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let movie of movies()">
                    <td class="table-poster-cell">
                        <img [src]="movie.posterUrl" [alt]="movie.title" class="table-poster">
                    </td>
                    <td><strong>{{ movie.title }}</strong></td>
                    <td>{{ movie.originalTitle }} ({{ movie.releaseYear }})</td>
                    <td><span class="type-badge-inline">{{ movie.type }}</span></td>
                    <td>
                        <div class="genres-inline">
                            <span *ngFor="let genre of movie.genres" class="genre-tag">{{ genre }}</span>
                        </div>
                    </td>
                    <td>
                        <div class="list-actions">
                            <button *ngFor="let opt of watchStatusOptions" [class]="'status-btn-small ' + opt.class"
                                (click)="setWatchStatus(movie, opt.status)" [title]="opt.label">
                                {{ opt.label }}
                            </button>
                        </div>

                        <div *ngIf="userService.isAdmin()">
                            <app-delete-button [deleteAction]="getDeleteCallback(movie)" (deleted)="onDeleted(movie)">
                            </app-delete-button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal-backdrop" *ngIf="isModalOpen()" (click)="closeModal()">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <button class="modal-close-btn" (click)="closeModal()">&times;</button>

            <!-- Перевикористовуємо форму створення медіа -->
            <app-media-form (mediaCreated)="onMediaCreated()"></app-media-form>
        </div>
    </div>
</div>
