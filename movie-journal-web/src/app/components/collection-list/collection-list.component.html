<div class="collections-container">
    <div class="header-section">
        <div class="title-area">
            <h2>Колекції медіа</h2>
            <span class="count-badge">Знайдено: {{ totalCount() }}</span>

            <app-add-button label="Додати колекцію" (clicked)="openModal()"> </app-add-button>
        </div>

        <app-view-switcher [currentMode]="viewMode()" (modeChange)="viewMode.set($event)">
        </app-view-switcher>
    </div>

    <div *ngIf="loading()" class="loading">Завантаження колекцій...</div>

    <!-- 1. РЕЖИМ СІТКИ (GRID) -->
    <div class="cards-grid" *ngIf="!loading() && viewMode() === 'grid'">
        <app-grid-card *ngFor="let col of collections()" [imageUrl]="col.posterUrl" [imageAlt]="col.name"
            [title]="col.name" (cardClick)="openDetails(col)" [visibility]="col.visibility">

            <div class="tags" *ngIf="col.tags?.length">
                <span class="tag" *ngFor="let tag of col.tags">#{{ tag }}</span>
            </div>
        </app-grid-card>
    </div>

    <!-- 2. РЕЖИМ ТАБЛИЦІ / СПИСКУ (LIST) -->
    <div class="collections-list-view" *ngIf="!loading() && viewMode() === 'list'">
        <table class="collections-table">
            <thead>
                <tr>
                    <th class="table-poster-cell">Постер</th>
                    <th>Назва колекції</th>
                    <th>Теги</th>
                </tr>
            </thead>
            <tbody>
                @for (col of collections(); track col.id) {
                <tr class="clickable-row" tabindex="0" (click)="openDetails(col)" (keydown.enter)="openDetails(col)">
                    <td class="table-poster-cell">
                        <img [src]="col.posterUrl" alt="" class="table-poster">
                    </td>
                    <td>
                        <span class="collection-title-text">{{ col.name }}</span>
                    </td>
                    <td>
                        <div class="tags-inline" *ngIf="col.tags && col.tags.length > 0">
                            <span class="tag" *ngFor="let tag of col.tags">#{{ tag }}</span>
                        </div>
                        <span *ngIf="!col.tags || col.tags.length === 0" class="no-tags">—</span>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>

    <div class="modal-backdrop" *ngIf="isModalOpen()" (click)="closeModal()">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <button class="modal-close-btn" (click)="closeModal()">&times;</button>

            <app-collection-form (collectionCreated)="onCollectionCreated()"></app-collection-form>
        </div>
    </div>

    <!-- БІЧНЕ МЕНЮ ДЕТАЛЕЙ КОЛЕКЦІЇ -->
    <app-details-sidebar [isOpen]="isSidebarOpen()" [title]="selectedCollection()?.name ?? ''"
        [imageUrl]="selectedCollection()?.posterUrl" [imageAlt]="selectedCollection()?.name ?? ''"
        noImageText="Немає постера"
        [deleteAction]="selectedCollection() ? getDeleteCallback(selectedCollection()!) : undefined"
        (closed)="closeSidebar()" (editClicked)="onEditCollection()" (deleted)="onSidebarCollectionDeleted()">

        @if (selectedCollection(); as col) {
        <div class="sidebar-details-info">
            <div class="tags-section" *ngIf="col.tags?.length">
                <h4>Теги</h4>
                <div class="tags">
                    <span class="tag" *ngFor="let tag of col.tags">#{{ tag }}</span>
                </div>
            </div>
        </div>
        }
    </app-details-sidebar>
</div>
