services:
  mongo:
    image: mongodb/mongodb-community-server:latest
    container_name: movie-journal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongo_data:/data/db
  api:
    container_name: movie-journal-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080      
      MongoDbSettings__ConnectionString: ${MONGO_CONNECTION_STRING}
      MongoDbSettings__DatabaseName: movie-journal
      JwtSettings__Issuer: movie-journal
      JwtSettings__Audience: movie-journal-clients
      JwtSettings__SecretKey: ${JWT_SECRET}
      JwtSettings__ExpirationDays: 7
      AdminSeedSettings__Username: admin
      AdminSeedSettings__Password: ${ADMIN_PASSWORD}
volumes:
  mongo_data: